<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photo Flow</title>
    <!--
      Theme-color / icons / manifest / apple-mobile-web-app meta are injected by basaltAppPlugin
      (basalt-ui/vite) from the token palette — never hand-write those hexes here.
    -->
    <script>
      // Prevent flash of wrong color scheme on load
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value')
        document.documentElement.setAttribute('data-mantine-color-scheme', stored || 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
